# Input filenames are <study_prefix>__<table>.flat.csv from cumulus-library export.
[tables.analysis]
primary_key = ["subject_ref"]

[[tables.analysis.columns]]
name = "subject_ref"
type = "string"
description = "Subject key; analysis unit is one subject."

[[tables.analysis.columns]]
name = "index_date"
type = "date"
description = "First retained encounter in this demonstration."

[[tables.analysis.columns]]
name = "next_encounter_date"
type = "date"
nullable = true
description = "Next documented encounter after index; missing means unknown."

[[tables.analysis.columns]]
name = "days_to_next_encounter"
type = "integer"
nullable = true
units = "days"
description = "Elapsed days from index to the next documented encounter."
