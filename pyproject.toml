[project]
name = "cumulus-library-pcx"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["cumulus-study-builder==0.4.1", "cumulus-library>=6.3.2,<6.4"]
description = "Migrated pcx study on the shared Cumulus study builder."

[project.optional-dependencies]
test = ["pytest", "duckdb", "sqlglot", "PyYAML"]
biostats = ["cumulus-study-builder[biostats]==0.4.1"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["study*", "analysis*"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
