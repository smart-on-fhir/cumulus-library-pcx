[[actions]]
label = "Analysis-ready tables"
type = "export:flat"
tables = [
    "pcx__client_subject",
    "pcx__client_diagnosis",
    "pcx__client_encounter",
    "pcx__client_exposure",
    "pcx__client_timeline",
    "pcx__client_outcome",
    "pcx__client_dictionary_coverage",
]
