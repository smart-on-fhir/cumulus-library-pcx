name: PyPI

on:
  workflow_dispatch:

jobs:
  publish:
    # Note: the github pypi action, as of this writing (2026-05-05) relies on pulling a
    # docker image, and the image is only available for X64 processors. Trying to use this
    # on an ARM machine results in an error. So, don't switch over the requested architecture
    # until this is addressed (and, realistically, the speed advantage for a release is not
    # the most important anyway).
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6


    # As of this writing, we are assuming that the distributable wheel has been built via the
    # bespoke package/make_data_release.py script. When time allows, we need to update the
    # study builder/this repo to be runnable on more than one machine, and then should convert
    # this study to use a standard flit or other pyproject.toml-based build configuration step
    # when that happens, we'll need to add back the python setup infrastructure to this action
    - name: Publish
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        print_hash: true
        verbose: true
        packages-dir: release/dist/