[project]
name = "cumulus-library-pcx"
version = "0.5.3"
requires-python = ">=3.11"
dependencies = ["cumulus-library>=6.3.7,<6.4"]
description = "PCX methotrexate target clinical trial emuluation using Cumulus library."

[project.optional-dependencies]
test = ["pytest", "duckdb", "sqlglot", "PyYAML"]
dev = [
    "cumulus-study-builder @ git+ssh://git@github.com/smart-on-fhir/cumulus-study-builder.git@v0.5.7",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["cumulus_library_pcx*"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
